<!DOCTYPE html>
<html>

<head>

<title>Prediction Result</title>

<style>

body{
font-family:Arial;
background:linear-gradient(to right,#43cea2,#185a9d);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:40px;
border-radius:15px;
width:450px;
text-align:center;
}

h2{
color:#333;
}

.score{
font-size:30px;
color:#007BFF;
margin:20px;
}

ul{
text-align:left;
}

button{
padding:10px 20px;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
margin-top:15px;
cursor:pointer;
}

a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Prediction Result</h2>

<div class="score">
Predicted Score : {{prediction}}
</div>

<h3>Suggestions to Improve</h3>

{% if suggestions %}

<ul>

{% for s in suggestions %}

<li>{{s}}</li>

{% endfor %}

</ul>

{% else %}

<p>Excellent performance! Keep it up.</p>

{% endif %}

<br>

<a href="/history/{{student_id}}">
<button>View Previous Performance</button>
</a>

<br><br>

<a href="/">
<button>Go Back</button>
</a>

</div>

</body>

</html>
