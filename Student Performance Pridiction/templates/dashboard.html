<!DOCTYPE html>
<html>

<head>

<title>Student Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f2f4f8;
margin:0;
}

.header{
background:#007BFF;
color:white;
padding:20px;
text-align:center;
font-size:26px;
}

.container{
width:90%;
margin:auto;
margin-top:30px;
}

.cards{
display:flex;
justify-content:space-around;
margin-bottom:40px;
}

.card{
background:white;
padding:20px;
width:25%;
border-radius:10px;
box-shadow:0px 3px 10px rgba(0,0,0,0.1);
text-align:center;
}

.chart-container{
display:flex;
justify-content:center;
gap:40px;
margin-bottom:40px;
}

.chart-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 3px 10px rgba(0,0,0,0.1);
width:350px;
text-align:center;
}

canvas{
max-width:250px;
max-height:250px;
margin:auto;
}

table{
width:60%;
margin:auto;
border-collapse:collapse;
background:white;
box-shadow:0px 3px 10px rgba(0,0,0,0.1);
}

th{
background:#007BFF;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<div class="header">
Student Performance Dashboard
</div>

<div class="container">

<div class="chart-container">

<div class="chart-box">
<h3>Performance Distribution</h3>
<canvas id="pieChart"></canvas>
</div>

<div class="chart-box">
<h3>Top Students</h3>
<canvas id="barChart"></canvas>
</div>

</div>

<h2 style="text-align:center">Top Students</h2>

<table>

<tr>
<th>Student ID</th>
<th>Final Score</th>
</tr>

{% for row in table %}

<tr>
<td>{{row.student_id}}</td>
<td>{{row.final_score}}</td>
</tr>

{% endfor %}

</table>

</div>

<script>

new Chart(document.getElementById("pieChart"),{

type:"pie",

data:{
labels:["Excellent","Good","Average","Poor"],
datasets:[{
data:{{values}},
backgroundColor:["#28a745","#17a2b8","#ffc107","#dc3545"]
}]
}

});

new Chart(document.getElementById("barChart"),{

type:"bar",

data:{
labels:{{students | tojson}},
datasets:[{
label:"Final Score",
data:{{scores | tojson}},
backgroundColor:"#007BFF"
}]
}

});

</script>

</body>

</html>
